# BrewLite – Assignment 1. Chạy toàn bộ: docker compose up --build
#   Web:  http://localhost:3000   API: http://localhost:3001/health   DB: localhost:5432
# Trùng cổng với chương trình khác? Đổi WEB_PORT / API_PORT / DB_PORT trong file .env (xem .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brewlite']
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://brewlite:brewlite@db:5432/brewlite
      JWT_SECRET: ${JWT_SECRET:-brewlite-docker-secret}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - backend

volumes:
  pgdata:
