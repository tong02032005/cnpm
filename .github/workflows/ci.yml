name: CI

# Chạy khi mở/cập nhật pull request; cd.yml gọi lại workflow này làm quality gate.
on:
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit & integration test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E test
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test
          JWT_SECRET: ci-e2e-secret
          CORS_ORIGIN: http://localhost:3000
        run: |
          psql "$DATABASE_URL" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          node apps/api/dist/migrate.js
          node apps/api/dist/seed.js
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
